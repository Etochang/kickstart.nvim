set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -g focus-events on
set -g mouse on
set -s escape-time 10
set -g history-limit 50000
setw -g mode-keys vi

set -g pane-border-status top
set -g pane-border-format '#{pane_index} #{pane_current_command}'

bind-key a split-window -h -l 45% -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @menus_trigger 'Enter'
set -g @menus_config_file '~/.config/nvim/tmux.conf'
if-shell 'test -f "$HOME/.local/share/tmux/plugins/tmux-menus/menus.tmux"' \
	'run-shell "$HOME/.local/share/tmux/plugins/tmux-menus/menus.tmux"'